name: pestkg-paper-figures

services:
  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:2026.02.2}
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/pestkg-paper}
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    ports:
      - "127.0.0.1:${PAPER_NEO4J_HTTP_PORT:-7475}:7474"
      - "127.0.0.1:${PAPER_NEO4J_BOLT_PORT:-7688}:7687"
    volumes:
      - paper_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p pestkg-paper 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  renderer:
    image: pestkg-paper-figures:2026.08.3
    build:
      context: ../..
      dockerfile: research/figures/Dockerfile
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: pestkg-paper
    volumes:
      - ../../artifacts/research/figures/output:/workspace/artifacts/research/figures/output
    command:
      - /bin/sh
      - -c
      - >-
        python research/figures/neo4j/load_sample.py &&
        python research/figures/generate_figures.py
        --neo4j-uri bolt://neo4j:7687
        --neo4j-user neo4j
        --neo4j-password pestkg-paper &&
        python research/figures/generate_extended_figures.py
        --neo4j-uri bolt://neo4j:7687
        --neo4j-user neo4j
        --neo4j-password pestkg-paper &&
        python research/figures/build_delivery_package.py

volumes:
  paper_neo4j_data:
