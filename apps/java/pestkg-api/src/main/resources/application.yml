server:
  port: ${PORT:18088}

pestkg:
  data-dir: ${PESTKG_DATA_DIR:data/releases}
  state-dir: ${PESTKG_STATE_DIR:data/state}
  export-dir: ${PESTKG_EXPORT_DIR:runtime/java-exports}
  reference-dir: ${PESTKG_REFERENCE_DIR:data/reference-graphs}
  default-release: ${PESTKG_RELEASE_ID:PestKG_A_Data_Release_v1.0}
  graph-node-limit: ${PESTKG_GRAPH_NODE_LIMIT:1000}
  graph-edge-limit: ${PESTKG_GRAPH_EDGE_LIMIT:2000}

spring:
  application:
    name: pestkg-java-api
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
