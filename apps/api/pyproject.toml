[build-system]
requires = ["setuptools>=65.5"]
build-backend = "setuptools.build_meta"

[project]
name = "pestkg-api"
version = "1.1.0"
description = "Read-only API for the multicountry pesticide knowledge graph portal"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.2,<2",
  "fastapi>=0.115,<1",
  "neo4j>=5.26,<7",
  "pydantic-settings>=2.8,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
pestkg-release = "pestkg_api.release_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
